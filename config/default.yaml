# Single source of every setting and hyperparameter. Code reads these values; it never hard-codes them.
# Values that come from PROJECT_SPEC.md are taken verbatim. Settings for later stages are added
# when those stages are implemented, so nothing here is a guess.

paths:                      # relative to the repository root
  raw_dir: data/raw
  cache_dir: data/cache
  checkpoints_dir: checkpoints
  reports_dir: reports
  figures_dir: reports/figures

dataset:
  name: PTB-XL
  version: "1.0.3"
  base_url: https://physionet.org/files/ptb-xl/1.0.3/   # canonical location, cited in the README
  checksum_manifest: SHA256SUMS.txt           # PhysioNet's per-file SHA-256 list for this version
  # SHA-256 of physionet.org's own SHA256SUMS.txt for v1.0.3. It pins the exact file set and every
  # file's hash, so files fetched from a mirror are still checked against PhysioNet's list.
  checksum_manifest_sha256: b7224b92b341511ec3ceb13dc6652079b2c36a06504bcb49506f157f51dc695d
  database_csv: ptbxl_database.csv            # one row per record: labels, strat_fold, patient_id
  statements_csv: scp_statements.csv          # SCP code ontology (diagnostic_class lives here)
  record_dirs: [records100]                   # 100 Hz only (spec section 2)
  record_path_column: filename_lr             # ptbxl_database.csv column pointing at the 100 Hz record
  sampling_rate_hz: 100
  record_duration_s: 10
  n_leads: 12
  # PhysioNet's published figures for v1.0.3. Verification fails if the download disagrees.
  expected_records: 21799
  expected_patients: 18869

download:
  # PhysioNet's AWS Open Data mirror, listed on the PTB-XL page as s3://physionet-open/ptb-xl/1.0.3/.
  # Measured from this laptop: physionet.org ~7 KB/s per connection, the mirror ~2.5 MB/s.
  # Set this to dataset.base_url to download from physionet.org directly; both are verified the same way.
  source_url: https://physionet-open.s3.amazonaws.com/ptb-xl/1.0.3/
  workers: 32                 # concurrent HTTP connections; files are 24 kB so latency, not bandwidth, limits speed.
                              # S3 is built for this; drop to 4 if source_url points at physionet.org.
  timeout_s: 60               # per-request connect/read timeout
  max_attempts: 5             # per file, before giving up on it
  retry_backoff_s: 2.0        # wait = retry_backoff_s * 2**(attempt - 1)
  chunk_size_bytes: 65536
  lock_file: .download.lock   # in raw_dir; an OS-level lock stops two downloads writing the same files

splits:                       # PTB-XL strat_fold, patient-stratified (spec section 2)
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  val_folds: [9]
  test_folds: [10]

labels:
  superclasses: [NORM, MI, STTC, CD, HYP]     # column order of the multi-hot label matrix
  descriptions:
    NORM: Normal ECG
    MI: Myocardial infarction
    STTC: ST/T change
    CD: Conduction disturbance
    HYP: Hypertrophy
  # A diagnostic statement counts when its scp_codes likelihood is >= this. 0 keeps every one, as
  # PhysioNet's example_physionet.py does; that reproduces PhysioNet's published counts exactly.
  # Measured alternative: >= 15 removes 129 labels (127 of them STTC) and drops 13 more records.
  min_likelihood: 0
  # PhysioNet's published records per superclass for v1.0.3. Used only for the comparison table.
  physionet_reference_counts: {NORM: 9514, MI: 5469, STTC: 5235, CD: 4898, HYP: 2649}

norm_stats:                   # per-lead z-score statistics, training split only (spec section 2)
  file: norm_stats.json       # in the preprocessing variant's cache folder (see cache)
  std_ddof: 0                 # population std over all training samples of a lead
  workers: 8                  # processes reading WFDB records in parallel
  chunk_size: 64              # records per task sent to a worker

preprocessing:                # applied once, before caching and before computing norm_stats
  bandpass:
    enabled: false            # spec: implement, measure with and without, keep only if it helps
    low_hz: 0.5
    high_hz: 40.0
    order: 2                  # Butterworth order per pass; forward-backward (zero-phase) filtering doubles it

cache:                        # one-time arrays of every record, src/data/cache.py
  # Each preprocessing variant gets its own folder in paths.cache_dir: "raw" with the band-pass off,
  # e.g. "bandpass_0.5-40hz_order2" with it on. Both can exist side by side, each with its own norm_stats.
  signals_file: signals.npy   # float32 (records, 12 leads, 1000 samples) in mV, rows in ecg_id order
  labels_file: labels.npy     # uint8 (records, 5) multi-hot; all-zero rows are records without a superclass
  index_file: index.csv       # ecg_id, patient_id, strat_fold, labelled, record_path; one row per array row
  meta_file: meta.json        # written last, so its presence marks a complete build
  workers: 8                  # processes reading WFDB records in parallel
  chunk_size: 64              # records per task sent to a worker

augmentation:                 # training split only; validation and test are never augmented
  time_shift:
    enabled: true
    # Spec: "a random 8 s window from the 10 s, then pad". The record moves up to (10 - 8) s = 200 samples
    # earlier or later, so at least 8 s of real signal remain; the vacated samples are set to 0, which
    # after normalisation is the lead's training mean.
    window_s: 8
  amplitude_scale:
    enabled: true
    range: [0.8, 1.2]         # one factor per record, shared by all 12 leads; must stay > 0 (no sign inversion)
  gaussian_noise:
    enabled: true
    # Standard deviation in normalised units, i.e. 0.05 x each lead's training std (about 7-17 microvolts
    # here). That is well below the 0.1 mV ST-deviation criterion. A starting value; tune on fold 9 only.
    sigma: 0.05

dataloader:
  # Worker processes per split. Measured on this laptop with src/data/inspect_pipeline.py: one training
  # epoch loads in 2.9 s with 0 workers, 1.7 s with 2, 1.0 s with 4, plus about 7 s once to start them.
  # Each Windows worker re-imports CUDA torch and commits about 1.8 GB of memory, and this laptop has
  # about 10 GB of commit free, so: 2 for training, none for the small validation and test splits.
  # Revisit once the GPU time per training step is measured.
  num_workers: {train: 2, val: 0, test: 0}
  pin_memory: true            # page-locked host memory for faster copies to the GPU
  persistent_workers: true    # keep worker processes between epochs (only used when num_workers > 0)

model:                        # 1D ResNet, spec section 3
  stem_channels: 64
  stem_kernel: 7
  stem_stride: 2
  stage_channels: [64, 128, 256, 512]
  stage_strides: [1, 2, 2, 2]
  blocks_per_stage: 2
  block_kernel: 5
  head_dropout: 0.3

training:                     # spec section 3
  batch_size: 64              # RTX 3050 Laptop has 4 GB VRAM; never above 64
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-2
  max_epochs: 50
  early_stopping_metric: val_macro_auroc
  early_stopping_patience: 8
  seed: 42

evaluation:                   # spec section 4
  reliability_bins: 10
  high_sensitivity_target: 0.90

sample_plot:                  # src/data/inspect_record.py
  lead: II
  output: reports/figures/sample_record.png
  dpi: 150
  figure_width_in: 14
  # Standard ECG paper at 25 mm/s and 10 mm/mV: 1 mm = 0.04 s = 0.1 mV, 5 mm = 0.2 s = 0.5 mV.
  paper_speed_mm_per_s: 25
  gain_mm_per_mv: 10
  grid_minor_s: 0.04
  grid_major_s: 0.2
  grid_minor_mv: 0.1
  grid_major_mv: 0.5
