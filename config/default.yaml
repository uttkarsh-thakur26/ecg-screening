# Single source of every setting and hyperparameter. Code reads these values; it never hard-codes them.
# Values that come from PROJECT_SPEC.md are taken verbatim. Settings for later stages are added
# when those stages are implemented, so nothing here is a guess.

paths:                      # relative to the repository root
  raw_dir: data/raw
  cache_dir: data/cache
  checkpoints_dir: checkpoints
  reports_dir: reports
  figures_dir: reports/figures
  runs_dir: reports/runs     # one CSV (per-epoch log) and one JSON (config, commit, summary) per training run

dataset:
  name: PTB-XL
  version: "1.0.3"
  base_url: https://physionet.org/files/ptb-xl/1.0.3/   # canonical location, cited in the README
  checksum_manifest: SHA256SUMS.txt           # PhysioNet's per-file SHA-256 list for this version
  # SHA-256 of physionet.org's own SHA256SUMS.txt for v1.0.3. It pins the exact file set and every
  # file's hash, so files fetched from a mirror are still checked against PhysioNet's list.
  checksum_manifest_sha256: b7224b92b341511ec3ceb13dc6652079b2c36a06504bcb49506f157f51dc695d
  database_csv: ptbxl_database.csv            # one row per record: labels, strat_fold, patient_id
  statements_csv: scp_statements.csv          # SCP code ontology (diagnostic_class lives here)
  record_dirs: [records100]                   # 100 Hz only (spec section 2)
  record_path_column: filename_lr             # ptbxl_database.csv column pointing at the 100 Hz record
  sampling_rate_hz: 100
  record_duration_s: 10
  n_leads: 12
  # PhysioNet's published figures for v1.0.3. Verification fails if the download disagrees.
  expected_records: 21799
  expected_patients: 18869

download:
  # PhysioNet's AWS Open Data mirror, listed on the PTB-XL page as s3://physionet-open/ptb-xl/1.0.3/.
  # Measured from this laptop: physionet.org ~7 KB/s per connection, the mirror ~2.5 MB/s.
  # Set this to dataset.base_url to download from physionet.org directly; both are verified the same way.
  source_url: https://physionet-open.s3.amazonaws.com/ptb-xl/1.0.3/
  workers: 32                 # concurrent HTTP connections; files are 24 kB so latency, not bandwidth, limits speed.
                              # S3 is built for this; drop to 4 if source_url points at physionet.org.
  timeout_s: 60               # per-request connect/read timeout
  max_attempts: 5             # per file, before giving up on it
  retry_backoff_s: 2.0        # wait = retry_backoff_s * 2**(attempt - 1)
  chunk_size_bytes: 65536
  lock_file: .download.lock   # in raw_dir; an OS-level lock stops two downloads writing the same files

splits:                       # PTB-XL strat_fold, patient-stratified (spec section 2)
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  val_folds: [9]
  test_folds: [10]

labels:
  superclasses: [NORM, MI, STTC, CD, HYP]     # column order of the multi-hot label matrix
  descriptions:
    NORM: Normal ECG
    MI: Myocardial infarction
    STTC: ST/T change
    CD: Conduction disturbance
    HYP: Hypertrophy
  # A diagnostic statement counts when its scp_codes likelihood is >= this. 0 keeps every one, as
  # PhysioNet's example_physionet.py does; that reproduces PhysioNet's published counts exactly.
  # Measured alternative: >= 15 removes 129 labels (127 of them STTC) and drops 13 more records.
  min_likelihood: 0
  # PhysioNet's published records per superclass for v1.0.3. Used only for the comparison table.
  physionet_reference_counts: {NORM: 9514, MI: 5469, STTC: 5235, CD: 4898, HYP: 2649}

norm_stats:                   # per-lead z-score statistics, training split only (spec section 2)
  file: norm_stats.json       # in the preprocessing variant's cache folder (see cache)
  std_ddof: 0                 # population std over all training samples of a lead
  workers: 8                  # processes reading WFDB records in parallel
  chunk_size: 64              # records per task sent to a worker

preprocessing:                # applied once, before caching and before computing norm_stats
  bandpass:
    enabled: false            # spec: implement, measure with and without, keep only if it helps
    low_hz: 0.5
    high_hz: 40.0
    order: 2                  # Butterworth order per pass; forward-backward (zero-phase) filtering doubles it

cache:                        # one-time arrays of every record, src/data/cache.py
  # Each preprocessing variant gets its own folder in paths.cache_dir: "raw" with the band-pass off,
  # e.g. "bandpass_0.5-40hz_order2" with it on. Both can exist side by side, each with its own norm_stats.
  signals_file: signals.npy   # float32 (records, 12 leads, 1000 samples) in mV, rows in ecg_id order
  labels_file: labels.npy     # uint8 (records, 5) multi-hot; all-zero rows are records without a superclass
  index_file: index.csv       # ecg_id, patient_id, strat_fold, labelled, record_path; one row per array row
  meta_file: meta.json        # written last, so its presence marks a complete build
  workers: 8                  # processes reading WFDB records in parallel
  chunk_size: 64              # records per task sent to a worker

augmentation:                 # training split only; validation and test are never augmented
  time_shift:
    enabled: true
    # Spec: "a random 8 s window from the 10 s, then pad". The record moves up to (10 - 8) s = 200 samples
    # earlier or later, so at least 8 s of real signal remain; the vacated samples are set to 0, which
    # after normalisation is the lead's training mean.
    window_s: 8
  amplitude_scale:
    # Decision rule, fixed before applying it: keep scaling off unless scaling on has the higher mean HYP
    # validation AUPRC over seeds 42, 43 and 44 (fold 9; reports/runs/summary_amplitude_scale_seeds.json).
    # Mean +/- sample std over the 3 seeds:  HYP AUPRC   on 0.6574 +/- 0.0051, off 0.6688 +/- 0.0030
    #                                        macro AUROC on 0.9270 +/- 0.0003, off 0.9279 +/- 0.0009
    # On is not higher, so scaling stays off. Cost: CD AUPRC is lower without scaling in 3 of 3 seeds
    # (-0.0057 +/- 0.0041). Plausible reason for HYP: hypertrophy criteria are voltage thresholds, and a random
    # x0.8-1.2 factor blurs the absolute amplitude they depend on.
    enabled: false
    range: [0.8, 1.2]         # one factor per record, shared by all 12 leads; must stay > 0 (no sign inversion)
  gaussian_noise:
    enabled: true
    # Standard deviation in normalised units, i.e. 0.05 x each lead's training std (about 7-17 microvolts
    # here). That is well below the 0.1 mV ST-deviation criterion. A starting value; tune on fold 9 only.
    sigma: 0.05

dataloader:
  # Worker processes per split. Measured on this laptop with src/data/inspect_pipeline.py: one training
  # epoch loads in 2.9 s with 0 workers, 1.7 s with 2, 1.0 s with 4, plus about 7 s once to start them.
  # Each Windows worker re-imports CUDA torch and commits about 1.8 GB of memory, and this laptop has
  # about 10 GB of commit free, so: 2 for training, none for the small validation and test splits.
  # Revisit once the GPU time per training step is measured.
  num_workers: {train: 2, val: 0, test: 0}
  pin_memory: true            # page-locked host memory for faster copies to the GPU
  persistent_workers: true    # keep worker processes between epochs (only used when num_workers > 0)

model:                        # 1D ResNet, spec section 3
  stem_channels: 64
  stem_kernel: 7
  stem_stride: 2
  # The spec names a max pool after the stem but not its size: kernel 3, stride 2 as in ResNet (He et al. 2016).
  stem_pool_kernel: 3
  stem_pool_stride: 2
  stage_channels: [64, 128, 256, 512]
  stage_strides: [1, 2, 2, 2]
  blocks_per_stage: 2
  block_kernel: 5
  # The spec puts a Dropout between the two convolutions of each ResBlock without a rate. 0.2 is the rate
  # Ribeiro et al. (2020) use in the same position of their 12-lead ECG ResNet. A starting value; tune on fold 9 only.
  block_dropout: 0.2
  head_dropout: 0.3

training:                     # spec section 3
  batch_size: 64              # RTX 3050 Laptop has 4 GB VRAM; never above 64
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-2        # AdamW's decoupled weight decay, applied to every parameter
  # Spec: "1e-3, OneCycle or cosine schedule with warmup". Per optimiser step: linear warmup from lr/warmup_steps
  # to lr over warmup_epochs, then cosine decay to min_lr_ratio x lr at max_epochs. The schedule always spans
  # max_epochs, so a run that stops early stops part-way down the cosine.
  lr_schedule: warmup_cosine
  warmup_epochs: 2            # about 535 steps at batch 64; a starting value, not tuned
  min_lr_ratio: 0.0
  max_epochs: 50
  early_stopping_metric: val_macro_auroc
  early_stopping_patience: 8  # stop after this many epochs without a new best
  early_stopping_min_delta: 0.0   # any increase in validation macro AUROC counts as a new best
  seed: 42
  device: cuda                # train.py refuses to start without CUDA instead of quietly training on the CPU
  # Deterministic cuDNN and cuBLAS kernels: the same seed and config give the same weights, so two runs that
  # differ in one setting differ only because of it. Costs some speed.
  deterministic: true
  overfit:                    # sanity check of the training loop: python -m src.training.train --overfit
    n_samples: 50             # training records, drawn with seed; augmentation off
    epochs: 300               # 50 records fit in one batch, so one optimiser step per epoch
    # Pass criterion: mean BCE (with pos_weight) on the 50 records, in eval mode, at the end. 0.01 is a mean
    # predicted probability of about 0.99 for every true label and 0.01 for every absent one.
    max_loss: 0.01

comparison:                   # src/training/compare_runs.py: two runs' best checkpoints on the validation split
  # Paired bootstrap: each resample draws validation patients with replacement (all of a patient's records come
  # together, because records of one patient are not independent) and scores both runs on the same records.
  bootstrap_samples: 2000
  ci_level: 0.95
  # The best checkpoint must reproduce the validation metrics logged for its epoch to within this.
  reproduce_tolerance: 1.0e-6

evaluation:                   # spec section 4; src/evaluation/evaluate_val.py uses the validation split only
  # The run whose best checkpoint is evaluated: the committed config (amplitude scaling off) with seed 42.
  model_run: 20261017-215633_no-amp-scale
  # Every other class is an abnormality and gets the high-sensitivity operating point; this one does not.
  normal_class: NORM
  # High-sensitivity operating point: per abnormal class, the highest threshold whose validation sensitivity
  # is >= this. Spec: "sensitivity >= 0.90 for each abnormal class".
  high_sensitivity_target: 0.90
  reliability_bins: 10
  thresholds_file: thresholds.json     # in paths.reports_dir
  val_metrics_file: metrics_val.json   # in paths.reports_dir; reports/metrics.json is the final (test) evaluation's
  figures:                    # in paths.figures_dir
    dpi: 150
    panel_size_in: 3.2        # width and height of one per-class panel, in inches

calibration:                  # src/training/calibrate.py; fitted and chosen on the validation split (fold 9) only
  file: calibration.json      # in paths.reports_dir; evaluate_val applies it before choosing thresholds
  figure: reliability_val.png # in evaluation.figures' folder (paths.figures_dir)
  # Per class, two calibrators fitted to the validation logits by minimising the mean binary cross-entropy
  # WITHOUT pos_weight: temperature, sigmoid(z / T), and Platt scaling, sigmoid(a z + b). The one with the lower
  # validation ECE (evaluation.reliability_bins equal-width bins) is kept; on an exact tie, temperature (fewer parameters).
  lbfgs:                      # torch.optim.LBFGS with the strong Wolfe line search, started at the identity (T = 1; a = 1, b = 0)
    lr: 1.0                   # first trial step of each line search; 1 is the natural step for a quasi-Newton method
    max_iter: 100             # 1 or 2 parameters on about 2,000 records: converges in well under 20 iterations
    history_size: 10
    tolerance_grad: 1.0e-10   # stop when every gradient component is below this
    tolerance_change: 1.0e-14 # or when the loss or the step changes by less than this
  # A fit counts as converged only if every gradient component of the mean BCE is below this at the solution;
  # otherwise calibrate.py stops with an error instead of saving an unconverged calibrator.
  max_final_gradient: 1.0e-7
  # Both calibrators are strictly increasing, so per-class AUROC and AUPRC may differ from the uncalibrated values
  # by floating-point rounding only.
  ranking_tolerance: 1.0e-12

baselines:                    # spec section 3, src/models/baselines.py; fit on the training split, scored on validation only
  report_file: baselines_val.json   # in paths.reports_dir
  workers: 8                  # processes extracting features in parallel
  chunk_size: 128             # records per task sent to a worker
  rpeaks:
    # Pan-Tompkins-style QRS detector on one lead. Values are Pan & Tompkins (1985) or were chosen on training
    # records only, without labels, by cross-lead agreement: `python -m src.models.rpeak_check` compares variants
    # on 3,000 training records (share of records whose lead II beat count is within 1 of both lead I and V5):
    # this detector 96.2%; without the T-wave rule 95.7%; without the search-back 95.6%; with the threshold set
    # from the record's maximum 92.9%; wfdb XQRS 56.6% (it marks P and T waves at 100 Hz: 14 beats per record
    # median); wfdb GQRS 83.4% (it misses beats).
    lead: II                  # the standard rhythm lead
    band_hz: [5.0, 15.0]      # QRS energy band (Pan & Tompkins); removes baseline wander and most of the P and T waves
    filter_order: 2           # Butterworth order per pass; run forwards and backwards (zero-phase)
    integration_window_s: 0.15    # moving-window integration of the squared slope, about one QRS width
    refractory_s: 0.2         # no two returned beats closer than this (300 bpm)
    # Signal level = median height of the highest third of the candidate peaks, and the threshold is a
    # fraction of it. The median of a group follows the typical QRS, so one or two large ventricular
    # ectopic beats (PVCs) no longer lift the threshold above the normal beats. With the level taken from
    # the record's maximum instead, the 1st percentile of beats per record falls from 8 to 2.
    signal_level_top_fraction: 0.33
    threshold_fraction: 0.3
    # Pan & Tompkins' T-wave rule: a candidate within this time of the previous beat, with less than this
    # share of its maximum slope, is a T wave.
    twave_window_s: 0.36
    twave_slope_ratio: 0.5
    # Pan & Tompkins' search-back: an RR gap longer than this multiple of the median RR is searched again
    # at this fraction of the threshold, and its highest candidate becomes a beat.
    searchback_rr_ratio: 1.66
    searchback_threshold_ratio: 0.5
    peak_search_s: 0.08       # the beat is placed at the largest band-passed deflection within this of the integrated peak
    # Fewer RR intervals: the RR features are missing (NaN), which gradient boosting handles natively. The
    # search-back also needs this many intervals to have a median RR, so it is skipped below it.
    min_rr_intervals: 2
    rr_std_ddof: 1            # sample standard deviation of the RR intervals (SDNN)
    # A quality check needing no annotations: the beat count on `lead` should match these other leads.
    agreement_leads: [I, V5]
    agreement_tolerance_beats: 1
  rpeak_check:                # src/models/rpeak_check.py compares detector variants on training records only
    records: 3000             # random training records, sampled with training.seed
  gradient_boosting:          # sklearn HistGradientBoostingClassifier, one binary classifier per class
    # sklearn's defaults, written out so the report records them. No tuning: the validation score stays an
    # untouched estimate. early_stopping must stay false: sklearn's would hold out a random 10% of the
    # training records, not patients, and all tuning belongs to the validation split.
    learning_rate: 0.1
    max_iter: 100
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 0.0
    max_bins: 255
    early_stopping: false

sample_plot:                  # src/data/inspect_record.py
  lead: II
  output: reports/figures/sample_record.png
  dpi: 150
  figure_width_in: 14
  # Standard ECG paper at 25 mm/s and 10 mm/mV: 1 mm = 0.04 s = 0.1 mV, 5 mm = 0.2 s = 0.5 mV.
  paper_speed_mm_per_s: 25
  gain_mm_per_mv: 10
  grid_minor_s: 0.04
  grid_major_s: 0.2
  grid_minor_mv: 0.1
  grid_major_mv: 0.5
